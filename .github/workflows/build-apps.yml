name: build-apps

# Internal builds for the team: the Windows and macOS desktop apps and the Android APK, none of
# them store-signed. Run it from the Actions tab to get the files as run artifacts, or push an
# `app-v*` tag to also attach them to a GitHub release. (Plain `v*` tags publish server images.)
on:
  workflow_dispatch:
  push:
    tags: ["app-v*"]

permissions:
  contents: read

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ad-hoc signed (package.json `mac.identity`), so Apple Silicon runs it without a
          # Developer ID; Gatekeeper asks once on first open. macos-26 runners are often
          # unavailable, so this uses macos-15 with its newest Xcode (the .icon needs Xcode 26).
          - name: macOS
            os: macos-15
            artifact: desktop-macos
            args: --mac --universal
          - name: Windows
            os: windows-2022
            artifact: desktop-windows
            args: --win --x64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Select the newest Xcode
        if: runner.os == 'macOS'
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Using $xcode"
          sudo xcode-select -s "$xcode"
      - run: pnpm install --frozen-lockfile
      - name: Generate the database client for desktop compilation
        run: pnpm db:generate
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo
      - name: Build renderer and Electron main process
        run: pnpm --filter @rakazo/web build && pnpm --filter @rakazo/desktop build
        env:
          RAKAZO_ALLOW_DEV_SECRETS: "1"
      - name: Package
        shell: bash
        env:
          ARGS: ${{ matrix.args }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        # ARGS is unquoted on purpose: it holds several flags. electron-builder downloads its
        # tools from GitHub, which sometimes answers 504, so try again before failing.
        run: |
          for attempt in 1 2 3; do
            pnpm --filter @rakazo/desktop exec electron-builder $ARGS --publish never && exit 0
            echo "Packaging failed (attempt $attempt); retrying."
            sleep 20
          done
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/out/*.dmg
            apps/desktop/out/*.exe
          if-no-files-found: error
          compression-level: 0

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: https://mentos.shimanto.xyz
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.3
      - run: pnpm install --frozen-lockfile
      - name: Generate Android project
        run: |
          pnpm --filter @rakazo/mobile exec expo prebuild --platform android --no-install
          # R8 runs out of the template's 2 GB heap on the release build.
          sed -i -e 's/MaxMetaspaceSize=512m/MaxMetaspaceSize=1g/' -e 's/-Xmx[0-9]*[mg]/-Xmx6g/' \
            apps/mobile/android/gradle.properties
          grep jvmargs apps/mobile/android/gradle.properties
      # Expo's template signs release builds with its bundled debug keystore, the same on every
      # run, so a new APK installs over the previous one.
      - name: Build APK
        working-directory: apps/mobile/android
        run: ./gradlew app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Name the APK
        run: |
          version="$(node -p "require('./apps/mobile/app.json').expo.version")"
          mkdir -p "$RUNNER_TEMP/apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/apk/Mentosbot-$version.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error
          compression-level: 0

  release:
    name: Attach to GitHub release
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: files
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" files/* --title "Mentosbot $TAG" --generate-notes
